<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site 1 — Observation Challenge</title>
  <style>
    :root {
      --bg: #121016;
      --card-bg: #1c1822;
      --accent: #ec4899;
      --accent-hover: #db2777;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #2d2638;
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .header {
      margin-bottom: 24px;
    }

    .badge {
      display: inline-block;
      background-color: rgba(236, 72, 153, 0.15);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 12px;
      border: 1px solid rgba(236, 72, 153, 0.3);
    }

    h1 {
      font-size: 1.8rem;
      color: #fff;
      margin-bottom: 8px;
    }

    p.desc {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .timer-box {
      background: #0d0b10;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent);
      margin: 20px 0;
      letter-spacing: 2px;
    }

    .form-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #0d0b10;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      padding: 12px 20px;
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    .message {
      margin-top: 16px;
      font-size: 0.9rem;
      min-height: 24px;
    }

    .success { color: var(--success); }
    .error { color: var(--error); }

    /* Structural deco element */
    .hint-container {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <!-- 
    ==================================================
    [SECRET CLUE FOR SITE 1]
    FLAG: KEY_BinX
    ==================================================
  -->

  <div class="container">
    <div class="header">
      <span class="badge">SITE 1 — OBSERVATION</span>
      <h1>تحدي قوة الملاحظة</h1>
    
    </div>

    <div class="timer-box" id="timer">02:00</div>

    <div class="form-group">
      <input type="text" id="flagInput" placeholder="أدخل الكود السري هنا..." autocomplete="off">
      <button onclick="checkFlag()">تحقق</button>
    </div>

    <div class="message" id="msg"></div>

  </div>

  <script>
    const CORRECT_FLAG = "KEY_BinX";
    let timeLeft = 120; // 2 minutes in seconds

    const timerEl = document.getElementById('timer');
    const msgEl = document.getElementById('msg');

    const countdown = setInterval(() => {
      let minutes = Math.floor(timeLeft / 60);
      let seconds = timeLeft % 60;

      minutes = minutes < 10 ? '0' + minutes : minutes;
      seconds = seconds < 10 ? '0' + seconds : seconds;

      timerEl.textContent = `${minutes}:${seconds}`;

      if (timeLeft <= 0) {
        clearInterval(countdown);
        timerEl.textContent = "00:00";
        timerEl.style.color = "var(--error)";
        msgEl.textContent = "انتهى الوقت! حاول مرة أخرى.";
        msgEl.className = "message error";
        document.getElementById('flagInput').disabled = true;
      }
      timeLeft--;
    }, 1000);

    function checkFlag() {
      const userInput = document.getElementById('flagInput').value.trim();
      if (userInput === CORRECT_FLAG) {
        msgEl.textContent = "🎉 إجابة صحيحة! أحسنت القيمة المستخرجة هي Key الأصلي.";
        msgEl.className = "message success";
        clearInterval(countdown);
      } else {
        msgEl.textContent = "❌ كود خاطئ، ابحث جيداً في الـ HTML!";
        msgEl.className = "message error";
      }
    }
  </script>
</body>
</html>
